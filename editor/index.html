<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CHINON 自助網站編輯器 V7</title>
  <link rel="stylesheet" href="https://unpkg.com/grapesjs@0.23.6/dist/css/grapes.min.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <strong>CHINON 編輯器 V5</strong>
      <span>溫暖生活版・保留舊內容・Wix-like 基礎工具</span>
    </div>

    <div class="pages">
      <select id="pageSelect" title="選擇頁面"></select>
      <button id="btnAddPage">＋頁面</button>
      <button id="btnRenamePage">改名</button>
      <button id="btnDeletePage">刪頁</button>
    </div>

    <div class="addbar">
      <button id="btnAddText">＋文字</button>
      <button id="btnAddHeading">＋標題</button>
      <button id="btnAddImage">＋圖片</button>
      <button id="btnAddButton">＋按鈕</button>
      <button id="btnAddLinkText">＋連結文字</button>
      <button id="btnAddSection">＋區塊</button>
      <button id="btnAddColumns">＋雙欄</button>
      <button id="btnAddThreeColumns">＋三欄</button>
      <button id="btnAddDivider">＋分隔線</button>
      <button id="btnAddSpacer">＋留白</button>
      <button id="btnAddShape">＋圖形</button>
      <button id="btnAddVideo">＋影片</button>
    </div>

    <input id="imagePicker" type="file" accept="image/*" hidden>
    <input id="replaceImagePicker" type="file" accept="image/*" hidden>
    <input id="backgroundImagePicker" type="file" accept="image/*" hidden>

    <div class="editbar">
      <button id="btnPixelMove" class="primary">✥ 自由移動</button>
      <button id="btnResize">↔ 縮放框</button>
      <button id="btnDuplicate">複製</button>
      <button id="btnDelete">刪除</button>
      <button id="btnResetMove">↶ 原位</button>
      <button id="btnLayerUp">上一層</button>
      <button id="btnLayerDown">下一層</button>
      <button id="btnLayerTop">最上層</button>
    </div>

    <div class="actionbar">
      <button id="btnLink">🔗 超連結</button>
      <button id="btnUnlink">移除連結</button>
      <button id="btnReplaceImage">換圖片</button>
      <button id="btnBackgroundImage">背景圖</button>
      <button id="btnQuickStyle">🎨 快速樣式</button>
      <button id="btnUndo">↶ Undo</button>
      <button id="btnRedo">↷ Redo</button>
      <button id="btnCode">HTML / CSS</button>
      <button id="btnSave">儲存</button>
      <button id="btnReload">重新載入</button>
      <button id="btnExport" class="publish">下載網站 ZIP</button>
    </div>

    <div class="devicebar">
      <button data-device="Desktop">桌機</button>
      <button data-device="Tablet">平板</button>
      <button data-device="Mobile">手機</button>
    </div>
  </header>

  <div id="statusbar">
    <span id="statusText">準備中…</span>
    <span>雙擊文字可直接編輯；右側 Styles 可調完整樣式。</span>
  </div>

  <main id="editorShell">
    <div id="gjs"></div>
  </main>

  <dialog id="linkDialog">
    <form method="dialog" class="dialog-form">
      <div class="dialog-head">
        <strong>設定超連結</strong>
        <button value="cancel">✕</button>
      </div>
      <label>網址
        <input id="linkUrl" type="text" placeholder="https://example.com 或 about.html">
      </label>
      <label class="checkline">
        <input id="linkBlank" type="checkbox"> 在新分頁開啟
      </label>
      <div class="dialog-actions">
        <button value="cancel">取消</button>
        <button id="btnApplyLink" value="default" class="primary">套用連結</button>
      </div>
    </form>
  </dialog>

  <dialog id="quickStyleDialog">
    <form method="dialog" class="dialog-form wide">
      <div class="dialog-head">
        <strong>快速樣式</strong>
        <button value="cancel">✕</button>
      </div>

      <div class="style-grid">
        <label>字型
          <select id="quickFont">
            <option value="">不變更</option>
            <option value='"Noto Sans TC", sans-serif'>TW｜思源黑體</option>
            <option value='"Noto Serif TC", serif'>TW｜思源宋體</option>
            <option value='"LXGW WenKai TC", serif'>TW｜霞鶩文楷</option>
            <option value='"Iansui", cursive'>TW｜芫荽體</option>
            <option value='"Klee One", cursive'>TW｜Klee 手寫</option>
            <option value='"Zen Kurenaido", cursive'>TW｜Zen 手寫</option>
            <option value='"Yuji Syuku", serif'>TW｜Yuji 書寫</option>
          </select>
        </label>

        <label>字體大小
          <input id="quickFontSize" type="number" min="8" max="220" placeholder="例如 36">
        </label>

        <label>文字顏色
          <input id="quickColor" type="color" value="#1b241e">
        </label>

        <label>背景顏色
          <input id="quickBg" type="color" value="#fffdf8">
        </label>

        <label>圓角
          <input id="quickRadius" type="number" min="0" max="200" placeholder="例如 20">
        </label>

        <label>透明度 %
          <input id="quickOpacity" type="number" min="0" max="100" placeholder="100">
        </label>

        <label>水平對齊
          <select id="quickAlign">
            <option value="">不變更</option>
            <option value="left">靠左</option>
            <option value="center">置中</option>
            <option value="right">靠右</option>
            <option value="justify">左右對齊</option>
          </select>
        </label>

        <label>陰影
          <select id="quickShadow">
            <option value="">不變更</option>
            <option value="none">無陰影</option>
            <option value="0 3px 14px rgba(0,0,0,.28)">文字柔和陰影</option>
            <option value="0 12px 30px rgba(0,0,0,.14)">卡片柔和陰影</option>
            <option value="0 18px 55px rgba(0,0,0,.22)">明顯陰影</option>
          </select>
        </label>
      </div>

      <div class="quick-buttons">
        <button id="quickBold" type="button">粗體</button>
        <button id="quickItalic" type="button">斜體</button>
        <button id="quickUnderline" type="button">底線</button>
      </div>

      <div class="dialog-actions">
        <button value="cancel">取消</button>
        <button id="btnApplyQuickStyle" value="default" class="primary">套用</button>
      </div>
    </form>
  </dialog>

  <dialog id="codeDialog">
    <div class="dialog-head">
      <strong>目前頁面 HTML / 全站 CSS</strong>
      <button id="btnCloseCode">✕</button>
    </div>
    <div class="code-grid">
      <section>
        <div class="code-title">HTML</div>
        <textarea id="htmlCode" spellcheck="false"></textarea>
      </section>
      <section>
        <div class="code-title">CSS</div>
        <textarea id="cssCode" spellcheck="false"></textarea>
      </section>
    </div>
    <div class="dialog-actions">
      <button id="btnCopyHtml">複製 HTML</button>
      <button id="btnCopyCss">複製 CSS</button>
      <button id="btnApplyCode" class="primary">套用修改</button>
    </div>
  </dialog>

  <script src="https://unpkg.com/grapesjs@0.23.6/dist/grapes.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    window.CHINON_CONFIG = {
      fontUrl: "https://fonts.googleapis.com/css2?family=Iansui&family=Klee+One&family=LXGW+WenKai+TC:wght@300;400;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@400;500;600;700;900&family=Yuji+Syuku&family=Zen+Kurenaido&display=swap",
      fallbackCss: ":root{\n  --bg:#f7f4eb;\n  --paper:#fffdf8;\n  --ink:#1b241e;\n  --green:#163b29;\n  --line:rgba(22,59,41,.14);\n  --max:1200px;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{\n  margin:0;\n  background:var(--bg);\n  color:var(--ink);\n  font-family:-apple-system,BlinkMacSystemFont,\"Noto Sans TC\",\"PingFang TC\",\"Microsoft JhengHei\",sans-serif;\n  line-height:1.7;\n}\nimg{max-width:100%;display:block}\na{color:inherit}\n.site-page{min-height:100vh}\n.starter-section{\n  min-height:100vh;\n  display:grid;\n  place-items:center;\n  padding:28px;\n}\n.starter-card{\n  width:min(var(--max),100%);\n  padding:64px;\n  border:1px solid var(--line);\n  border-radius:28px;\n  background:var(--paper);\n}\n.starter-kicker{font-size:12px;letter-spacing:.24em;margin-bottom:16px}\nh1{margin:0 0 12px;font-size:clamp(48px,8vw,92px);line-height:1.05;font-family:inherit}\np{margin:0;max-width:760px;font-size:18px}\n@media(max-width:700px){\n  .starter-section{padding:14px}\n  .starter-card{padding:36px 24px}\n}\n",
      fallbackBody: "<main class=\"site-page\">\n    <section class=\"starter-section\">\n      <div class=\"starter-card\">\n        <div class=\"starter-kicker\">CHINON · TAIWAN</div>\n        <h1>奇農 CHINON</h1>\n        <p>這是全新的網站起點。請開啟 /editor/，用新增工具建立文字、圖片、按鈕、區塊與頁面。</p>\n      </div>\n    </section>\n  </main>\n  <script src=\"main.js\"></script>"
    };
  </script>
  <script src="editor.js"></script>
</body>
</html>
