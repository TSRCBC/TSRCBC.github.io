<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>奇農 CHINON｜免費視覺編輯器 V2</title>
  <link rel="stylesheet" href="https://unpkg.com/grapesjs@0.23.6/dist/css/grapes.min.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="chinon-toolbar">
    <div class="brand">
      <strong>CHINON 編輯器 V2</strong>
      <span>安全移動＋自由定位・直接延伸目前 GitHub 網站</span>
    </div>

    <label class="page-label">
      頁面
      <select id="pageSelect"></select>
    </label>

    <div class="toolbar-actions">
      <button id="btnReload" title="重新讀取 GitHub Pages 上目前的網站">重新載入網站</button>
      <button id="btnSave" title="儲存在這台瀏覽器">儲存</button>
      <button id="btnNudge" class="accent" title="保留 Flex/Grid，用 translate 安全拖動">↔ 微調拖動</button>
      <button id="btnFreeMove" title="需要浮在畫面上的物件才使用">✥ 自由定位</button>
      <button id="btnResetMove" title="恢復選取物件進入移動模式前的位置">恢復原位</button>
      <button id="btnLayerUp" title="z-index + 1">上一層</button>
      <button id="btnLayerDown" title="z-index - 1">下一層</button>
      <button id="btnLayerTop" title="z-index 999">最上層</button>
      <button id="btnCode">HTML / CSS</button>
      <button id="btnExport" class="accent2">下載網站 ZIP</button>
    </div>

    <div class="device-actions">
      <button data-device="Desktop">桌機</button>
      <button data-device="Tablet">平板</button>
      <button data-device="Mobile">手機</button>
    </div>
  </header>

  <div id="statusbar">
    <span id="statusText">準備中…</span>
    <span class="tip">一般移動先用「↔ 微調拖動」；只有要浮在畫面上的物件才用「✥ 自由定位」。</span>
  </div>

  <main id="editor-shell">
    <div id="gjs"></div>
  </main>

  <dialog id="codeDialog">
    <div class="dialog-head">
      <strong>目前頁面的 HTML / 全站 CSS</strong>
      <button id="btnCloseCode">關閉</button>
    </div>
    <div class="code-grid">
      <section>
        <div class="code-title">HTML</div>
        <textarea id="htmlCode" spellcheck="false"></textarea>
      </section>
      <section>
        <div class="code-title">CSS</div>
        <textarea id="cssCode" spellcheck="false"></textarea>
      </section>
    </div>
    <div class="dialog-actions">
      <button id="btnApplyCode" class="accent">套用修改</button>
      <button id="btnCopyHtml">複製 HTML</button>
      <button id="btnCopyCss">複製 CSS</button>
    </div>
  </dialog>

  <script src="https://unpkg.com/grapesjs@0.23.6/dist/grapes.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

\" id=\"i4wxx\">\n\n            <div class=\"product-image contain\" id=\"i1q05g\">\n\n              <img src=\"https://static.wixstatic.com/media/7f89c4_b7f718d11bf84e26aa8a877ee39b3558\\~mv2.png/v1/fill/w_250%2Ch_140%2Cal_c%2Cq_95%2Cenc_auto/7f89c4_b7f718d11bf84e26aa8a877ee39b3558\\~mv2.png\" alt=\"黃金 GABA 桑茶 天然果香\" id=\"ir8wzm\" />\n\n            </div>\n\n            <div class=\"card-body\" id=\"i9wvtl\">\n\n              <h3 id=\"iuc0hk\">GABA 桑茶・天然果香</h3>\n\n              <p id=\"im2akf\">天然桑葉經獨特發酵烘焙，呈現濃醇果香與甘甜尾韻。</p>\n\n              <a href=\"https://tsrcbc.github.io/gaba.html\" class=\"btn ghost\" id=\"il8i9j\">了解更多 →</a>\n\n            </div>\n\n          </article>\n\n          <article class=\"card\" id=\"is9vbr\">\n\n            <div class=\"product-image contain\" id=\"ifx3eg\">\n\n              <img src=\"https://static.wixstatic.com/media/7f89c4_fbbabc428b0f4748960fd41f3c051167\\~mv2.png/v1/fill/w_250%2Ch_140%2Cal_c%2Cq_95%2Cenc_auto/7f89c4_fbbabc428b0f4748960fd41f3c051167\\~mv2.png\" alt=\"黃金 GABA 桑茶 經典原味\" id=\"inreug\" />\n\n            </div>\n\n            <div class=\"card-body\" id=\"i7tpsz\">\n\n              <h3 id=\"ig3hh8\">GABA 桑茶・經典原味</h3>\n\n              <p id=\"i6j3tw\">嚴選嫩葉，以無氧發酵與恆溫製程，保留桑葉純粹風味。</p>\n\n              <a href=\"https://tsrcbc.github.io/gaba.html\" class=\"btn ghost\" id=\"if5xho\">了解更多 →</a>\n\n            </div>\n\n          </article>\n\n          <article class=\"card\" id=\"iz2fkh\">\n\n            <div class=\"product-image\" id=\"in1ruv\">\n\n              <img src=\"https://static.wixstatic.com/media/c1d112f24a9248d2b180668092820774.jpg/v1/fill/w_621%2Ch_414%2Cal_c%2Cq_80%2Cusm_0.66_1.00_0.01%2Cenc_avif%2Cquality_auto/c1d112f24a9248d2b180668092820774.jpg\" alt=\"秘魯黃金瑪卡\" id=\"iohe84\" />\n\n            </div>\n\n            <div class=\"card-body\" id=\"i57yuh\">\n\n              <h3 id=\"iubv4l\">秘魯黃金瑪卡</h3>\n\n              <p id=\"ioerkv\">來自秘魯高原的天然好物，相關有機與產地證明可查閱。</p>\n\n              <a href=\"https://tsrcbc.github.io/maca.html\" class=\"btn ghost\" id=\"imlorp\">了解更多 →</a>\n\n            </div>\n\n          </article>\n\n        </div>\n\n      </div>\n\n    </section>\n\n    <section class=\"section dark\" id=\"ivq48b\">\n\n      <div class=\"container process-wrap\" id=\"i3cehh\">\n\n        <div id=\"igv08o\">\n\n          <div class=\"eyebrow\" id=\"iq4vgs\">CRAFT</div>\n\n          <h2 id=\"ipz46b\">製茶堅持</h2>\n\n          <p class=\"muted\" id=\"ifbaf2\">從原料到成品，每一步都用心把關。</p>\n\n          <div class=\"process-photo\" id=\"iwykjf\">\n\n            <img src=\"https://static.wixstatic.com/media/7f89c4_852db789a75e422abfcb3d5172569d28\\~mv2.png/v1/fill/w_978%2Ch_686%2Cal_c%2Cq_90%2Cusm_0.66_1.00_0.01%2Cenc_avif%2Cquality_auto/%E6%A1%91%E8%91%89%E8%8C%B6%20GABA%20%E5%A0%85%E6%8C%81.png\" alt=\"奇農製茶堅持\" id=\"i4jwvi\" />\n\n          </div>\n\n        </div>\n\n        <div class=\"steps\" id=\"iaaab3\">\n\n          <div class=\"step\" id=\"ir2ez2\">\n\n            <span class=\"num\" id=\"ilneyh\">01</span>\n\n            <div id=\"i24o6j\">\n\n              <strong id=\"irg1a7\">原料堅持</strong>\n\n              <p id=\"iyrt5n\">嚴選台灣優質桑葉。</p>\n\n            </div>\n\n          </div>\n\n          <div class=\"step\" id=\"ijoah1\">\n\n            <span class=\"num\" id=\"igvv4b\">02</span>\n\n            <div id=\"iraexf\">\n\n              <strong id=\"i0il9x\">手工採摘</strong>\n\n              <p id=\"iz1ply\">選取五葉一芯與嫩葉。</p>\n\n            </div>\n\n          </div>\n\n          <div class=\"step\" id=\"ih1cg7\">\n\n            <span class=\"num\" id=\"it8y84\">03</span>\n\n            <div id=\"iv6f25\">\n\n              <strong id=\"iwvnea\">手工製作</strong>\n\n              <p id=\"ioanee\">多道工序與製茶師傅經驗。</p>\n\n            </div>\n\n          </div>\n\n          <div class=\"step\" id=\"i52i5d\">\n\n            <span class=\"num\" id=\"i6lzbb\">04</span>\n\n            <div id=\"if6m6d\">\n\n              <strong id=\"irhge2\">天然無毒</strong>\n\n              <p id=\"ipaqeg\"
