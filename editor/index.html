<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>CHINON 視覺網站編輯器</title>
  <link rel="stylesheet" href="editor.css?v=1090">
</head>
<body class="auth-locked">
  <div id="loginGate" class="login-gate">
    <div class="login-orb orb-a"></div>
    <div class="login-orb orb-b"></div>
    <section class="login-card">
      <div class="login-logo">C</div>
      <div class="login-eyebrow">CHINON PRIVATE CONSOLE</div>
      <h1>網站管理後台</h1>
      <p>驗證管理者後進入視覺編輯器</p>
      <form id="loginForm" autocomplete="off" novalidate>
        <label>帳號<input id="loginUser" type="text" value="luke" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="text" placeholder="管理帳號"><span class="login-hint">管理帳號已預填為 luke，可直接輸入密碼。</span></label>
        <label>密碼
          <div class="password-wrap">
            <input id="loginPass" type="password" autocomplete="new-password" autocapitalize="none" spellcheck="false" placeholder="管理密碼">
            <button id="togglePassword" type="button">顯示</button>
          </div>
        </label>
        <div id="loginError" class="login-error"></div>
        <button class="login-submit" type="submit"><span>進入管理後台</span><span>→</span></button>
      </form>
    </section>
  </div>

  <header class="topbar">
    <div class="brand">
      <strong>CHINON 編輯器 <span id="buildLabel">載入中…</span></strong>
      <span>同源畫布・先測試版・確認後再套正式站</span>
    </div>

    <div class="toolbar">
      <select id="pageSelect" title="頁面">
        <option value="index.html">首頁</option>
        <option value="about.html">關於奇農</option>
        <option value="craft.html">製茶堅持</option>
        <option value="gaba.html">GABA桑茶</option>
        <option value="maca.html">秘魯瑪卡</option>
        <option value="certificates.html">檢測證書</option>
        <option value="info.html">相關資訊</option>
        <option value="contact.html">聯繫我們</option>
      </select>

      <button id="btnAddImage">＋一般圖片</button>
      <button id="btnFlowImageAbove" class="accent" title="選一個標題或區塊，將圖片插入整個區塊上方">＋圖片區塊 ↑</button>
      <button id="btnFlowImageBelow" class="accent" title="選一個標題或區塊，將圖片插入整個區塊下方">＋圖片區塊 ↓</button>
      <button id="btnReplaceImage">換圖片</button>
      <button id="btnFindWixImage" title="跳到本頁下一張仍使用 Wix 網址的圖片">找WIX圖片</button>
      <button id="btnBackground">背景圖</button>
      <button id="btnFloat">✥ 自由擺放</button>
      <button id="btnUnfloat">回到排版</button>
      <button id="btnDeleteAdded">刪除圖片／新增物件</button>

      <button id="btnImgLeft">圖片靠左</button>
      <button id="btnImgCenter" class="accent">圖片置中</button>
      <button id="btnImgRight">圖片靠右</button>

      <button id="btnUndo">↶ Undo</button>
      <button id="btnRedo">↷ Redo</button>
      <button id="btnSave">儲存草稿</button>
      <button id="btnDraftHistory">草稿版本</button>
      <button id="btnSelfCheck">系統檢查</button>
      <button id="btnReload">重新載入官網</button>
    </div>

    <div class="publishbar">
      <button id="btnPreviewPublish" class="preview-btn">① 發布測試版</button>
      <button id="btnCheckPreview" disabled>檢查測試版部署</button>
      <button id="btnOpenPreview" disabled>② 開啟測試版</button>
      <button id="btnPromote" class="live-btn" disabled>③ 套用正式網站</button>
    </div>

    <div class="devices">
      <button data-width="1440" class="active">桌機</button>
      <button data-width="820">平板</button>
      <button data-width="390">手機</button>
    </div>
  </header>

  <div class="statusbar">
    <span id="status">編輯器啟動中…</span>
    <span class="status-note">修改會自動暫存；「儲存草稿」會建立可恢復版本。重新載入官網不再刪除備份。</span>
  </div>

  <main class="workspace">
    <section class="canvas-panel">
      <div id="canvasFrame" class="canvas-frame" data-width="1440">
        <iframe id="siteFrame" title="CHINON 網站即時畫布"></iframe>
      </div>
    </section>

    <aside class="inspector">
      <div class="inspector-title">
        <strong>選取物件</strong>
        <span id="selectedLabel">尚未選取</span>
      </div>

      <section>
        <h3>文字</h3>
        <label>字型
          <select id="fontFamily">
            <option value="">不變更</option>
            <option value='"Noto Sans TC", sans-serif'>思源黑體</option>
            <option value='"Noto Serif TC", serif'>思源宋體</option>
            <option value='"LXGW WenKai TC", serif'>霞鶩文楷</option>
            <option value='"Iansui", cursive'>芫荽體</option>
            <option value='"Klee One", cursive'>Klee 手寫體</option>
            <option value='"Zen Kurenaido", cursive'>Zen 手寫體</option>
            <option value='"Yuji Syuku", serif'>Yuji 書寫體</option>
          </select>
        </label>
        <label>字體大小
          <select id="fontSize">
            <option value="">不變更</option>
            <option>12px</option><option>14px</option><option>16px</option><option>18px</option>
            <option>20px</option><option>22px</option><option>24px</option><option>28px</option>
            <option>32px</option><option>36px</option><option>40px</option><option>48px</option>
            <option>56px</option><option>64px</option><option>72px</option><option>80px</option>
            <option>96px</option><option>120px</option>
          </select>
        </label>
        <label>粗細
          <select id="fontWeight">
            <option value="">不變更</option>
            <option value="300">300｜細</option>
            <option value="400">400｜一般</option>
            <option value="500">500｜中等</option>
            <option value="600">600｜半粗</option>
            <option value="700">700｜粗體</option>
            <option value="800">800｜很粗</option>
            <option value="900">900｜最粗</option>
          </select>
        </label>
        <label>對齊
          <select id="textAlign">
            <option value="">不變更</option>
            <option value="left">靠左</option>
            <option value="center">置中</option>
            <option value="right">靠右</option>
            <option value="justify">左右對齊</option>
          </select>
        </label>
        <label>行高
          <select id="lineHeight">
            <option value="">不變更</option>
            <option value="1">1.0</option><option value="1.2">1.2</option><option value="1.4">1.4</option>
            <option value="1.6">1.6</option><option value="1.8">1.8</option><option value="2">2.0</option>
          </select>
        </label>
        <label>字距
          <select id="letterSpacing">
            <option value="">不變更</option>
            <option value="-2px">-2 px</option><option value="-1px">-1 px</option><option value="0px">0</option>
            <option value="1px">1 px</option><option value="2px">2 px</option><option value="4px">4 px</option>
            <option value="6px">6 px</option><option value="8px">8 px</option>
          </select>
        </label>
        <label>文字顏色 <input id="textColor" type="color" value="#222222"></label>
        <label>文字陰影
          <select id="textShadow">
            <option value="">不變更</option>
            <option value="none">無</option>
            <option value="0 2px 4px rgba(0,0,0,.2)">柔和陰影</option>
            <option value="0 4px 10px rgba(0,0,0,.3)">明顯陰影</option>
          </select>
        </label>
      </section>

      <section>
        <h3>尺寸／間距</h3>
        <label>寬度
          <select id="widthCtl">
            <option value="">不變更</option>
            <option value="auto">自動</option><option value="25%">25%</option><option value="33.333%">1/3</option>
            <option value="50%">50%</option><option value="66.667%">2/3</option><option value="75%">75%</option>
            <option value="100%">100%</option><option value="240px">240 px</option><option value="320px">320 px</option>
            <option value="480px">480 px</option><option value="640px">640 px</option>
          </select>
        </label>
        <label>上外距
          <select id="marginTop"><option value="">不變更</option><option value="0">0</option><option value="8px">8 px</option><option value="16px">16 px</option><option value="24px">24 px</option><option value="40px">40 px</option><option value="64px">64 px</option></select>
        </label>
        <label>下外距
          <select id="marginBottom"><option value="">不變更</option><option value="0">0</option><option value="8px">8 px</option><option value="16px">16 px</option><option value="24px">24 px</option><option value="40px">40 px</option><option value="64px">64 px</option></select>
        </label>
        <label>上內距
          <select id="paddingTop"><option value="">不變更</option><option value="0">0</option><option value="8px">8 px</option><option value="16px">16 px</option><option value="24px">24 px</option><option value="40px">40 px</option><option value="64px">64 px</option></select>
        </label>
        <label>下內距
          <select id="paddingBottom"><option value="">不變更</option><option value="0">0</option><option value="8px">8 px</option><option value="16px">16 px</option><option value="24px">24 px</option><option value="40px">40 px</option><option value="64px">64 px</option></select>
        </label>
      </section>

      <section>
        <h3>圖片／背景</h3>
        <label>圖片填滿
          <select id="objectFit">
            <option value="">不變更</option>
            <option value="contain">完整顯示</option>
            <option value="cover">填滿裁切</option>
            <option value="fill">拉伸填滿</option>
          </select>
        </label>
        <label>圖片焦點
          <select id="objectPosition">
            <option value="">不變更</option>
            <option value="left top">左上</option><option value="center top">上中</option><option value="right top">右上</option>
            <option value="left center">左中</option><option value="center center">正中央</option><option value="right center">右中</option>
            <option value="left bottom">左下</option><option value="center bottom">下中</option><option value="right bottom">右下</option>
          </select>
        </label>
        <label>背景位置
          <select id="backgroundPosition">
            <option value="">不變更</option>
            <option value="left top">左上</option><option value="center top">上中</option><option value="right top">右上</option>
            <option value="left center">左中</option><option value="center center">正中央</option><option value="right center">右中</option>
            <option value="left bottom">左下</option><option value="center bottom">下中</option><option value="right bottom">右下</option>
          </select>
        </label>
        <label>背景尺寸
          <select id="backgroundSize">
            <option value="">不變更</option>
            <option value="cover">填滿裁切</option>
            <option value="contain">完整顯示</option>
            <option value="auto">原始尺寸</option>
          </select>
        </label>
        <label>背景顏色 <input id="backgroundColor" type="color" value="#ffffff"></label>
        <label>圓角
          <select id="borderRadius"><option value="">不變更</option><option value="0">直角</option><option value="8px">8 px</option><option value="16px">16 px</option><option value="24px">24 px</option><option value="9999px">膠囊</option><option value="50%">圓形</option></select>
        </label>
        <label>陰影
          <select id="boxShadow"><option value="">不變更</option><option value="none">無</option><option value="0 4px 14px rgba(0,0,0,.12)">柔和</option><option value="0 12px 32px rgba(0,0,0,.2)">明顯</option></select>
        </label>
      </section>

      <section>
        <h3>連結</h3>
        <label>網址 <input id="linkUrl" type="text" placeholder="https://... 或 about.html"></label>
        <button id="btnApplyLink" class="full">套用連結</button>
      </section>
    </aside>
  </main>

  <input id="addImageInput" type="file" accept="image/*" hidden>
  <input id="flowImageInput" type="file" accept="image/*" hidden>
  <input id="replaceImageInput" type="file" accept="image/*" hidden>
  <input id="backgroundInput" type="file" accept="image/*" hidden>


  <dialog id="draftHistoryDialog">
    <div class="dialog-card">
      <div class="dialog-head">
        <strong id="draftHistoryTitle">草稿版本</strong>
        <button id="btnCloseDraftHistory" type="button">✕</button>
      </div>
      <p class="draft-help">這裡保留手動儲存與重新載入前的版本。恢復版本不會直接改正式網站。</p>
      <div id="draftHistoryList" class="draft-history-list"></div>
      <div class="dialog-actions">
        <button id="btnSaveVersionNow" type="button" class="primary">現在建立版本</button>
      </div>
    </div>
  </dialog>

  <dialog id="selfCheckDialog">
    <div class="dialog-card">
      <div class="dialog-head"><strong>V10 系統檢查</strong><button id="btnCloseSelfCheck" type="button">✕</button></div>
      <div id="selfCheckResults" class="self-check-results">尚未執行。</div>
      <div class="dialog-actions"><button id="btnRunSelfCheck" type="button" class="primary">重新檢查</button></div>
    </div>
  </dialog>

  <dialog id="publishDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head"><strong id="publishTitle">發布設定</strong><button value="cancel">✕</button></div>
      <p id="publishIntro">第一次發布需要 GitHub Token。</p>
      <div class="grid2">
        <label>GitHub Owner<input id="publishOwner" value="TSRCBC"></label>
        <label>Repository<input id="publishRepo" value="TSRCBC.github.io"></label>
        <label>Branch<input id="publishBranch" value="main"></label>
        <label>GitHub Token<input id="publishToken" type="password" placeholder="github_pat_..."></label>
      </div>
      <label class="check"><input id="rememberToken" type="checkbox"> 記住這台電腦的 Token</label>
      <div id="publishProgress" class="publish-progress"></div>
      <div id="baselineConflictActions" class="baseline-conflict-actions" hidden>
        <div class="baseline-conflict-note">
          目前草稿會完整保留。只有在你確認 GitHub 上的新版本可以由目前草稿繼續編輯時，才使用下方同步。
        </div>
        <button id="btnSyncBaselineKeepDraft" type="button">保留草稿並同步最新版本</button>
      </div>
      <div class="dialog-actions">
        <button value="cancel">取消</button>
        <button id="btnDoPublish" type="button" class="primary">開始</button>
      </div>
    </form>
  </dialog>

  <script src="editor.js?v=1090"></script>
</body>
</html>
